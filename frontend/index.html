<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gecko Next — сервис аудио/видеоразметки</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
</head>
<body>
  <div id="app">
    <div id="auth-view" class="hidden"></div>
    <div id="main-view" class="hidden">
      <header id="topbar">
        <div class="brand" onclick="App.navigate('/')">
          <span class="brand-icon">🎙️</span>
          <span class="brand-name">Gecko <b>Next</b></span>
        </div>
        <nav id="main-nav"></nav>
        <div class="user-box">
          <span id="user-name"></span>
          <span id="user-role" class="badge"></span>
          <button class="btn btn-ghost" onclick="App.logout()">Выйти</button>
        </div>
      </header>
      <main id="content"></main>
    </div>
  </div>
  <div id="toast-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/projects.js"></script>
  <script src="/js/tasks.js"></script>
  <script src="/js/annotator.js"></script>
  <script src="/js/verifier.js"></script>
  <script src="/js/terms.js"></script>
  <script src="/js/analytics.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
</html>
